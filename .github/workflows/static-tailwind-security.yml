name: Static Tailwind asset security check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  asset-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/static-tailwind.test.cjs
